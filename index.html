/* Layout: one narrow column like a page in an exercise book. Home = three set rows; quiz = one flashcard with the answer area directly below. */
:root{
  --paper:#f4f5f9;
  --surface:#ffffff;
  --ink:#141a2e;
  --muted:#596079;
  --line:#dce0eb;
  --accent:#2a45c2;        /* Königsblau: school fountain-pen ink */
  --accent-ink:#ffffff;
  --accent-soft:#e7ebfb;
  --ok:#1a7345;
  --ok-soft:#e2f2e9;
  --bad:#bf3329;           /* teacher's red pen */
  --bad-soft:#fbe8e6;
  --lv-new:#d4d8e4;
  --lv-pick:#a4b3ee;
  --lv-write:#2a45c2;
  --lv-sure:#1a7345;
  --f-word:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f121c; --surface:#171b29; --ink:#e9ebf5; --muted:#9ba1b9; --line:#2a3046;
    --accent:#8c9fff; --accent-ink:#0f121c; --accent-soft:#1f2645;
    --ok:#5ccf8c; --ok-soft:#14291e; --bad:#ff7d70; --bad-soft:#331a18;
    --lv-new:#2c3248; --lv-pick:#4a5794; --lv-write:#8c9fff; --lv-sure:#5ccf8c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f121c; --surface:#171b29; --ink:#e9ebf5; --muted:#9ba1b9; --line:#2a3046;
  --accent:#8c9fff; --accent-ink:#0f121c; --accent-soft:#1f2645;
  --ok:#5ccf8c; --ok-soft:#14291e; --bad:#ff7d70; --bad-soft:#331a18;
  --lv-new:#2c3248; --lv-pick:#4a5794; --lv-write:#8c9fff; --lv-sure:#5ccf8c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}
.wrap{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Home */
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
h1{font-family:var(--f-word);font-weight:600;font-size:clamp(1.9rem,7vw,2.4rem);line-height:1.1;margin:.3rem 0 0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:.5rem 0 0;max-width:40ch}
.controls{display:grid;gap:14px;margin-block:22px}
.ctl-label{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-weight:500;font-size:.92rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sets{display:grid;gap:10px}
.set{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.set-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.set-head > div{min-width:0}
.set-title{font-family:var(--f-word);font-size:1.22rem;font-weight:600;line-height:1.25;margin:0;overflow-wrap:anywhere}
.set-sub{font-size:.85rem;color:var(--muted);margin-top:2px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--lv-new)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:1px}
.legend .of::before{display:none}
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.foot{margin-top:26px;display:grid;gap:10px;font-size:.85rem;color:var(--muted)}
.foot p{margin:0}
.reset summary{cursor:pointer;color:var(--muted);min-height:36px;display:flex;align-items:center}
.reset-list{display:grid;gap:4px;margin-top:6px}
.reset-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:4px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:.9rem;padding:6px 0;cursor:pointer;min-height:38px;text-align:left}
.linkbtn.danger{color:var(--bad)}
.levels{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:10px}
.levels b{font-weight:600;color:var(--ink)}

/* Quiz */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.icon{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon svg{width:16px;height:16px}
.qmeta{flex:1;min-width:0;display:grid;gap:6px}
.qmeta span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.qcount{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 26px}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.74rem}
.tag{padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.03em}
.tag.plain{background:transparent;color:var(--muted);padding-inline:0}
.dots{margin-left:auto;display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--lv-new)}
.dots i.on{background:var(--accent)}
.prompt{font-family:var(--f-word);font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.15;margin:26px 0 0;overflow-wrap:anywhere;text-wrap:balance}
.prompt.sentence{font-size:clamp(1.18rem,4.8vw,1.42rem);line-height:1.45;text-wrap:pretty;margin-top:20px}
.pnote{font-family:var(--f-word);font-style:italic;color:var(--muted);margin:8px 0 0}
.answer{margin-top:14px;display:grid;gap:10px}
.instr{margin:0;color:var(--muted);font-size:.92rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:440px){.choices{grid-template-columns:1fr}}
.choice{min-height:52px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;font-weight:500;cursor:pointer;display:flex;gap:12px;align-items:center;min-width:0}
.choice span:last-child{min-width:0;overflow-wrap:anywhere}
.choice .k{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-ui);font-size:1.15rem;font-weight:500}
.typed input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.subrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hintline{font-family:var(--f-word);font-size:1.15rem;letter-spacing:.12em;color:var(--muted);margin:0}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:transparent}
.fb.bad{background:var(--bad-soft);border-color:transparent}
.fb-h{font-weight:700;display:flex;align-items:center;gap:8px;margin:0}
.fb-h svg{width:18px;height:18px;flex:none}
.fb.ok .fb-h{color:var(--ok)}
.fb.bad .fb-h{color:var(--bad)}
.fb-ans{font-family:var(--f-word);font-size:1.3rem;line-height:1.3;margin:0;overflow-wrap:anywhere}
.fb-ans.sentence{font-size:1.12rem;line-height:1.45}
.yours{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
.note{font-size:.84rem;color:var(--muted);margin:0}
.note b{color:var(--ink);font-weight:600}
.note.level{color:var(--accent);font-weight:500}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:0 8px;white-space:normal;line-height:1.2;border-color:var(--line);background:var(--surface);color:var(--ink)}
.rate .r-bad{color:var(--bad)}
.rate .r-ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .btn-primary{flex:1}

/* End */
.score{font-family:var(--f-word);font-size:clamp(2.2rem,9vw,3rem);font-weight:600;line-height:1.05;margin:.3rem 0 0;font-variant-numeric:tabular-nums}
.missed{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.missed li{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:2px}
.missed li:first-child{border-top:0}
.missed .m-q{font-family:var(--f-word);font-size:1.05rem;overflow-wrap:anywhere}
.missed .m-a{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.end-actions{display:grid;gap:8px;margin-top:20px}
.end-actions .btn{width:100%}
.allgood{margin:16px 0 0;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

var RX_STRESS = new RegExp("[" + String.fromCharCode(0x301, 0x300) + "]", "g");
var RX_MARKS = new RegExp("[" + String.fromCharCode(0x301, 0x300, 0x308) + "]", "g");

function normRu(s){
  return String(s).toLowerCase().normalize("NFD").replace(RX_MARKS, "").normalize("NFC")
    .replace(/[.,!?;:()«»„“”"'’\/]/g, " ").replace(/[-‐–—]/g, " ").replace(/\s+/g, " ").trim();
}
function normDe(s){
  var t = String(s).toLowerCase().normalize("NFC")
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
  t = t.normalize("NFD").replace(RX_STRESS, "").normalize("NFC");
  t = t.replace(/[.,!?;:()«»„“”"'’\/]/g, " ").replace(/[-‐–—]/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(/^hier\s+/, "").replace(/^(der|die|das|den|ein|eine)\s+/, "");
  return t;
}
function variantsDe(c){
  var out = [];
  c.de.forEach(function(d){ var n = normDe(d); out.push(n); if (n.indexOf("sich ") === 0) out.push(n.slice(5)); });
  return out;
}
function variantsRu(c){ return [c.ru].concat(c.alt || []).map(normRu); }
function lev(a, b){
  if (a === b) return 0;
  var m = a.length, n = b.length, prev = [], cur = [], i, j;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++){
    cur = [i];
    for (j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function checkTyped(raw, it){
  var rd = it.dir === "rd";
  var nf = rd ? normDe : normRu;
  var targets = rd ? variantsDe(it.card) : variantsRu(it.card);
  var whole = nf(raw);
  if (!whole) return "empty";
  if (targets.indexOf(whole) >= 0) return "right";
  var parts = raw.split(/[,;\/]/).map(function(s){ return nf(s); }).filter(Boolean);
  for (var i = 0; i < parts.length; i++) if (targets.indexOf(parts[i]) >= 0) return "right";
  var cands = [whole].concat(parts);
  for (var k = 0; k < cands.length; k++){
    for (var t = 0; t < targets.length; t++){
      if (targets[t].length >= 4 && lev(cands[k], targets[t]) === 1) return "near";
    }
  }
  return "wrong";
}
function hintPattern(it){
  var base = it.dir === "rd" ? it.card.de[0] : it.card.ru;
  return stripStress(base).split(/\s+/).map(function(w){

/* ---------- Progress buckets ---------- */
function stats(set){
  var out = {neu:0, pick:0, write:0, sure:0, total:0};
  set.cards.forEach(function(c){
    dirsFor(prefs.dir).forEach(function(d){
      out.total++;
      var e = progress[keyOf(set, c, d)];
      if (!e || !e.s) out.neu++;
      else if (e.l >= 4) out.sure++;
      else if (set.kind !== "sentences" && e.l >= 2) out.write++;
      else out.pick++;
    });
  });
  return out;
}

/* ---------- Round building ---------- */
function buildRound(set, dirs, size, onlyKeys){
  var pool = [];
  set.cards.forEach(function(c){ dirs.forEach(function(d){ pool.push({key:keyOf(set, c, d), card:c, dir:d, again:false}); }); });
  if (onlyKeys){
    pool = pool.filter(function(it){ return onlyKeys.indexOf(it.key) >= 0; });
  } else {
    var e = function(it){ return progress[it.key]; };
    var learning = shuffle(pool.filter(function(it){ var x = e(it); return x && x.s > 0 && x.l < 4; }));
    learning.sort(function(a, b){ return (e(b).w > 0 && e(b).l < 2 ? 1 : 0) - (e(a).w > 0 && e(a).l < 2 ? 1 : 0); });
    var fresh = pool.filter(function(it){ var x = e(it); return !x || !x.s; });
    var sure = pool.filter(function(it){ var x = e(it); return x && x.s > 0 && x.l >= 4; })
      .sort(function(a, b){ return (e(a).t || 0) - (e(b).t || 0); });
    var take = size === "open" ? learning.length + fresh.length : Number(size);
    if (take === 0) take = Math.min(20, sure.length);
    pool = learning.concat(fresh, sure).slice(0, take);
  }
  shuffle(pool);
  for (var i = 1; i < pool.length; i++){
    if (pool[i].card === pool[i-1].card){
      for (var j = i + 1; j < pool.length; j++){
        if (pool[j].card !== pool[i-1].card){ var t = pool[i]; pool[i] = pool[j]; pool[j] = t; break; }
      }
    }
  }
  return pool;
}
function startRound(setId, onlyKeys){
  var set = SETS.filter(function(s){ return s.id === setId; })[0];
  var items = buildRound(set, dirsFor(prefs.dir), prefs.size, onlyKeys);
  if (!items.length) return;
  quiz = {set:set, queue:items, pos:0, right:0, half:0, total:0, wrong:[], pending:null, stage:"ask", hintUsed:false, draft:""};
  window.scrollTo(0, 0);
  renderQuiz(true);
}

/* ---------- Quiz ---------- */
function curItem(){ return quiz.queue[quiz.pos]; }
function modeOf(it){ return quiz.set.kind === "sentences" ? "reveal" : (lvl(it.key) >= 2 ? "type" : "choice"); }
function makeChoices(it){
  var rd = it.dir === "rd";
  var txt = function(c){ return rd ? deShow(c) : c.ru; };
  var nk = function(c){ return rd ? normDe(c.de.join(" ")) : normRu(c.ru); };
  var seen = {}; seen[nk(it.card)] = 1;
  var out = [{text:txt(it.card), correct:true}];
  var pool = shuffle(quiz.set.cards.filter(function(c){ return c !== it.card; }));
  for (var i = 0; i < pool.length && out.length < 4; i++){
    var k = nk(pool[i]); if (seen[k]) continue; seen[k] = 1;
    out.push({text:txt(pool[i]), correct:false});
  }
  return shuffle(out);
}
var ICON_X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>';

function feedbackHtml(it){

  if (ok && p.outcome === "right" && lvl(it.key) === 3) h += '<p class="note level">Jetzt sitzt es. Die Karte zählt als sicher.</p>';
  h += '</div>';
  h += '<div class="actions"><button type="button" class="btn btn-primary" id="next-btn" data-act="next">Weiter</button>' +
    ((!ok && p.typed) ? '<button type="button" class="linkbtn" data-act="override">Zählt doch als richtig</button>' : '') + '</div>';
  return h;
}

function commit(it, outcome){
  var e = {l:0, s:0, w:0, t:0}, old = progress[it.key];
  if (old){ e.l = old.l || 0; e.s = old.s || 0; e.w = old.w || 0; e.t = old.t || 0; }
  e.s++; e.t = Date.now();
  if (outcome === "right") e.l = Math.min(5, e.l + 1);
  else if (outcome === "wrong"){
    e.w++;
    if (quiz.set.kind === "sentences") e.l = Math.max(0, e.l - 2);
    else e.l = e.l >= 2 ? 2 : 0;
  }
  progress[it.key] = e;
  saveLocal();
  scheduleWrite();
  if (!it.again){
    quiz.total++;
    if (outcome === "right" || outcome === "hint") quiz.right++;
    else if (outcome === "half") quiz.half++;
    else quiz.wrong.push(it);
  }
  if (outcome === "wrong" && !it.requeued){
    it.requeued = true;
    var at = Math.min(quiz.queue.length, quiz.pos + 4);
    quiz.queue.splice(at, 0, {key:it.key, card:it.card, dir:it.dir, again:true, requeued:true});
  }
}
function advance(){
  quiz.pos++; quiz.stage = "ask"; quiz.pending = null; quiz.hintUsed = false; quiz.draft = ""; quiz.chosen = null;
  window.scrollTo(0, 0);
  renderQuiz(true);
}
function onChoice(i){
  if (!quiz || quiz.stage !== "ask") return;
  var it = curItem(); if (it.mode !== "choice") return;
  var ch = it.choices[i]; if (!ch) return;
  quiz.chosen = i;
  quiz.pending = {outcome:ch.correct ? "right" : "wrong", state:ch.correct ? "right" : "wrong", input:ch.correct ? "" : ch.text, typed:false};
  quiz.stage = "fb";
  renderQuiz(true);
}
function onType(val){
  var it = curItem();
  var r = checkTyped(val, it);
  if (r === "empty"){ var el = document.getElementById("answer"); if (el) el.focus(); return; }
  var ok = r === "right";
  quiz.pending = {outcome:ok ? (quiz.hintUsed ? "hint" : "right") : "wrong", state:r, input:val.trim(), typed:true};
  quiz.stage = "fb";
  renderQuiz(true);
}
function next(){
  if (!quiz || quiz.stage !== "fb") return;
  commit(curItem(), quiz.pending.outcome);
  advance();
}
function rate(outcome){
  if (!quiz || quiz.stage !== "revealed") return;
  commit(curItem(), outcome);
  advance();
}
function closeQuiz(){
  if (quiz && quiz.stage === "fb" && quiz.pending) commit(curItem(), quiz.pending.outcome);
  flush();
  renderHome();
  window.scrollTo(0, 0);
}

/* ---------- End of round ---------- */
function renderEnd(){
  var q = quiz, set = q.set;
  var sentence = set.kind === "sentences";
  var seen = {}, missed = [];
  q.wrong.forEach(function(it){ if (!seen[it.key]){ seen[it.key] = 1; missed.push(it); } });
  var list = missed.map(function(it){
    var c = it.card, rd = it.dir === "rd";
    var qtext = sentence ? (rd ? c.ru : c.deText) : (rd ? c.ru : dePrompt(c));
    var atext = sentence ? (rd ? c.deText : c.ru) : (rd ? deShow(c) : c.ru);
    return '<li><span class="m-q" lang="' + (rd ? "ru" : "de") + '">' + esc(qtext) + '</span><span class="m-a" lang="' + (rd ? "de" : "ru") + '">' + esc(atext) + '</span></li>';
  }).join("");
  $app.innerHTML = '<div class="wrap">' +
    '<div class="eyebrow" lang="ru">' + esc(set.title) + ' · Runde fertig</div>' +
    '<p class="score">' + q.right + ' von ' + q.total + ' richtig</p>' +
    (q.half ? '<p class="note" style="margin-top:6px">' + q.half + ' teilweise gewusst</p>' : '') +
    (missed.length ? '<p class="allgood">Diese ' + (missed.length === 1 ? "Karte kommt" : "Karten kommen") + ' in der nächsten Runde zuerst:</p><ul class="missed">' + list + '</ul>'
                   : '<p class="allgood">Keine Fehler in dieser Runde.</p>') +
    '<div class="end-actions">' +
      (missed.length ? '<button type="button" class="btn btn-primary" data-act="retry">Fehler nochmal üben</button>' : '') +
      '<button type="button" class="btn ' + (missed.length ? 'btn-ghost' : 'btn-primary') + '" data-start="' + set.id + '">Neue Runde</button>' +
      '<button type="button" class="btn btn-ghost" data-act="home">Zur Übersicht</button>' +
    '</div></div>';
  quiz.missedKeys = missed.map(function(it){ return it.key; });
  quiz.stage = "end";
  flush();
}

/* ---------- Events ---------- */
$app.addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.pref){
    var name = b.dataset.pref, val = b.dataset.val;
    prefs[name] = (name === "size" && val !== "open") ? Number(val) : val;
    saveLocal(); renderHome(); return;
  }
  if (b.dataset.start){ startRound(b.dataset.start); return; }
  if (b.dataset.reset){
    var id = b.dataset.reset;
    if (armedReset === id){
      Object.keys(progress).forEach(function(k){ if (k.indexOf(id + "_") === 0) delete progress[k]; });
      armedReset = null; clearTimeout(armTimer);
      saveLocal(); scheduleWrite(200); renderHome();
    } else {
      armedReset = id; clearTimeout(armTimer);
      armTimer = setTimeout(function(){ armedReset = null; if (!quiz) renderHome(); }, 4000);
      renderHome();
    }
    return;
  }
  if (b.dataset.choice != null){ onChoice(Number(b.dataset.choice)); return; }
  if (b.dataset.rate){ rate(b.dataset.rate); return; }
  var act = b.dataset.act;
  if (!act) return;
  if (act === "close"){ closeQuiz(); return; }
  if (act === "home"){ renderHome(); window.scrollTo(0, 0); return; }
  if (act === "retry"){ var keys = quiz.missedKeys || []; startRound(quiz.set.id, keys); return; }
  if (!quiz) return;
  if (act === "next"){ next(); return; }
  if (act === "reveal"){ quiz.stage = "revealed"; renderQuiz(false); return; }
  if (act === "hint"){
    var inp = document.getElementById("answer");
    quiz.draft = inp ? inp.value : "";
    quiz.hintUsed = true; renderQuiz(true); return;
  }
  if (act === "skip"){
    quiz.pending = {outcome:"wrong", state:"wrong", input:"", typed:false};
    quiz.stage = "fb"; renderQuiz(true); return;
  }
  if (act === "override"){
    quiz.pending.outcome = quiz.hintUsed ? "hint" : "right";
    quiz.pending.state = "right";
    renderQuiz(true); return;
  }
});
$app.addEventListener("submit", function(e){
  e.preventDefault();
  if (e.target.id === "type-form"){ var inp = document.getElementById("answer"); onType(inp ? inp.value : ""); }
});
$app.addEventListener("toggle", function(e){ if (e.target && e.target.id === "reset") resetOpen = e.target.open; }, true);
document.addEventListener("keydown", function(e){
  if (!quiz) return;
  var tag = (e.target && e.target.tagName) || "";
  var it = curItem();
  if (quiz.stage === "ask" && it){
    if (it.mode === "choice" && /^[1-4]$/.test(e.key)){ onChoice(Number(e.key) - 1); e.preventDefault(); }
    else if (it.mode === "reveal" && (e.key === "Enter" || e.key === " ") && tag !== "BUTTON"){ quiz.stage = "revealed"; renderQuiz(false); e.preventDefault(); }
  } else if (quiz.stage === "fb" && e.key === "Enter" && tag !== "BUTTON"){ next(); e.preventDefault(); }
  else if (quiz.stage === "revealed" && /^[1-3]$/.test(e.key)){ rate(["wrong","half","right"][Number(e.key) - 1]); e.preventDefault(); }
});

renderHome();
})();
</script>
</body>
</html>
